name: stock-alert

on:
  schedule:
    # GitHub 시간은 UTC(한국시간 -9시간)
    - cron: "20 22 * * 0-4"   # 한국시간 월~금 07:20 시작 -> 계산 후 07:50에 전송
    - cron: "20 9 * * 1-5"    # 한국시간 월~금 18:20 시작 -> 계산 후 18:50에 전송
  workflow_dispatch:           # 수동 실행 버튼 (테스트용)
    inputs:
      source:
        description: "데이터 출처 (auto=네이버 실패 시 KRX 전환 / naver / krx)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - naver
          - krx

# 성과 기록 파일(history/alerts.csv)을 저장소에 자동 저장하기 위한 권한
permissions:
  contents: write

# 아침/저녁 실행이 겹쳐도 기록 파일이 꼬이지 않도록 한 번에 하나만 실행
concurrency:
  group: stock-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests pandas holidays pykrx

      - name: Run alert
        run: python stock_alert.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DATA_SOURCE: ${{ github.event.inputs.source || 'auto' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Save history
        if: always()
        run: |
          if [ -f history/alerts.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history/alerts.csv
            git diff --cached --quiet || (git commit -m "update alert history" && git push)
          fi

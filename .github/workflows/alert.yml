name: stock-alert

on:
  schedule:
    # GitHub 시간은 UTC(한국시간 -9시간)
    - cron: "20 23 * * 0-4"   # 한국시간 월~금 08:20 시작 -> 계산 후 08:50에 전송
    - cron: "0 10 * * 1-5"    # 한국시간 월~금 19:00
  workflow_dispatch:           # 수동 실행 버튼 (테스트용)

# 성과 기록 파일(history/alerts.csv)을 저장소에 자동 저장하기 위한 권한
permissions:
  contents: write

# 아침/저녁 실행이 겹쳐도 기록 파일이 꼬이지 않도록 한 번에 하나만 실행
concurrency:
  group: stock-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests pandas holidays

      - name: Run alert
        run: python stock_alert.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Save history
        if: always()
        run: |
          if [ -f history/alerts.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history/alerts.csv
            git diff --cached --quiet || (git commit -m "update alert history" && git push)
          fi
